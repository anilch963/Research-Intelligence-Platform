[project]
name = "research-intel-backend"
version = "0.1.0"
description = "Multi-agent RAG research & company intelligence API"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "langchain>=1.0",
    # EnsembleRetriever lives here since LangChain 1.0
    "langchain-classic>=1.0",
    # ragas 0.4 imports langchain_community.chat_models.vertexai, removed in 0.4
    "langchain-community>=0.3.27,<0.4",
    "langchain-openai>=1.0",
    "langchain-chroma>=1.0",
    "langchain-text-splitters>=1.0",
    "chromadb>=1.0",
    "rank-bm25>=0.2.2",
    "pypdf>=5.0",
]

[dependency-groups]
dev = ["httpx>=0.27"]
eval = ["ragas>=0.4,<0.5", "pandas>=2.2"]

[tool.uv]
default-groups = ["dev", "eval"]
package = false
